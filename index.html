<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Track&amp;Tag</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Track&amp;Tag">
    <meta name="description" content="Warehouse tracking and label printing — scan barcodes, weigh items, print labels via Bluetooth.">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144x144.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Ant Design -->
    <link id="antd-theme-link" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.15/antd.dark.min.css" crossorigin="anonymous"
        referrerpolicy="no-referrer" />
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-mode');
            document.getElementById('antd-theme-link').href = 'https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.15/antd.min.css';
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.15/antd.min.js" crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>

    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <!-- HTML5 QRCode -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/@ant-design/icons@4.8.0/dist/index.umd.js"></script>

    <style>
        :root {
            --bg-base: #0b0f19;
            --panel-bg: #1e293b;
            --text-primary: #f8fafc;
            --accent: #3b82f6;
            --amber: #ffb020;
            --laser: #ff4d4d;
        }

        :root.light-mode {
            --bg-base: #f0f2f5;
            --panel-bg: #ffffff;
            --text-primary: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        #root {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--panel-bg);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer {
            background-color: var(--panel-bg);
            padding: 16px 24px;
            display: flex;
            gap: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .main-content {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            min-height: 0;
        }

        .ant-card {
            border-radius: 10px;
        }

        .weight-display {
            font-size: clamp(1.5rem, 10vw, 4.5rem);
            font-weight: 700;
            text-align: center;
            color: #10b981;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            transition: color 0.3s;
            overflow-wrap: break-word;
            word-break: break-all;
            line-height: 1.1;
        }

        .weight-display.unlocked {
            color: #eab308;
            text-shadow: 0 0 20px rgba(234, 179, 8, 0.2);
        }

        .weight-unit {
            font-size: min(6vw, 2rem);
            color: #94a3b8;
            margin-left: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-connected {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .status-disconnected {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .hidden-canvas {
            display: none;
        }

        @media (max-width: 576px) {
            .hide-text-mobile span:not(.anticon) {
                display: none;
            }
        }

        .reticle {
            position: absolute;
            inset: 12%;
            pointer-events: none;
            z-index: 10;
        }

        .corner {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 2px solid var(--amber);
            opacity: 0.85;
        }

        .corner.tl {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 6px;
        }

        .corner.tr {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 6px;
        }

        .corner.bl {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 6px;
        }

        .corner.br {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 6px;
        }

        .scanline {
            position: absolute;
            left: 4%;
            right: 4%;
            top: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--laser) 15%, var(--laser) 85%, transparent);
            box-shadow: 0 0 8px 1px rgba(255, 77, 77, 0.7);
            animation: sweep 2.2s cubic-bezier(.4, 0, .2, 1) infinite;
        }

        @keyframes sweep {
            0% {
                top: 2%;
            }

            50% {
                top: 96%;
            }

            100% {
                top: 2%;
            }
        }

        /* Dark modal override */
        .dark-modal .ant-modal-content {
            background-color: var(--panel-bg);
            color: var(--text);
        }

        .dark-modal .ant-modal-header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dark-modal .ant-modal-title {
            color: var(--text);
        }

        .dark-modal .ant-modal-close {
            color: var(--text);
        }

        /* html5-qrcode overrides for dark mode */
        .dark-modal #qr-reader {
            border: none !important;
            border-radius: 0;
            overflow: hidden;
            margin-top: 0;
        }

        #qr-reader {
            border: none !important;
            border-radius: 8px;
        }

        .dark-modal #qr-reader a {
            color: #3b82f6 !important;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- Offscreen canvases for rendering -->
    <canvas id="labelCanvas" width="96" height="240" class="hidden-canvas"></canvas>
    <canvas id="barcodeCanvas" class="hidden-canvas"></canvas>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { Card, Button, Row, Col, Typography, message, Modal, Drawer, Table, Tabs, Form, Input, InputNumber, Space, Popconfirm, List, Select } = antd;
        const { Title, Text } = Typography;
        const { SettingOutlined, HistoryOutlined, PrinterOutlined, SaveOutlined, ShareAltOutlined, PlusOutlined, BulbOutlined, ApiOutlined, DisconnectOutlined, UploadOutlined, DownloadOutlined, DeleteOutlined, ScanOutlined, DashboardOutlined, CameraOutlined } = icons;

        // --- Defaults ---
        const DEFAULT_SETTINGS = {
            decimalPlaces: 3,
            printCommandRegex: '^CMD-PRINT$',
            saveCommandRegex: '^CMD-SAVE$',
            locationRegex: '^LOC-.*$',
            itemRegex: '^ITEM-.*$',
            template: [
                { type: 'text', content: 'LOC: {location}', x: 48, y: 20, size: 24, rot: 90 },
                { type: 'text', content: 'ID: {item}', x: 48, y: 70, size: 20, rot: 90 },
                { type: 'text', content: '{weight}kg', x: 48, y: 120, size: 30, rot: 90 },
                { type: 'barcode', content: '{item}', x: 48, y: 200, height: 40, width: 2, rot: 90, showText: false }
            ]
        };

        // --- Bluetooth Scale Logic ---
        const SCALE_SERVICE = 0x181d;
        const SCALE_CHAR = 0x2a9d;

        // --- Bluetooth Printer Logic ---
        const PRINTER_SERVICE = '0000ff00-0000-1000-8000-00805f9b34fb';
        const PRINTER_CHAR = '0000ff02-0000-1000-8000-00805f9b34fb';

        const useLongPress = (onLongPress, onClick, ms = 500) => {
            const [startLongPress, setStartLongPress] = useState(false);
            const callbackRef = useRef(onLongPress);
            const clickRef = useRef(onClick);
            const triggeredRef = useRef(false);

            useEffect(() => {
                callbackRef.current = onLongPress;
                clickRef.current = onClick;
            }, [onLongPress, onClick]);

            useEffect(() => {
                let timerId;
                if (startLongPress) {
                    triggeredRef.current = false;
                    timerId = setTimeout(() => {
                        triggeredRef.current = true;
                        if (callbackRef.current) callbackRef.current();
                        setStartLongPress(false);
                    }, ms);
                } else {
                    clearTimeout(timerId);
                }
                return () => clearTimeout(timerId);
            }, [ms, startLongPress]);

            const start = useCallback(() => {
                setStartLongPress(true);
            }, []);

            const stop = useCallback((e) => {
                setStartLongPress(false);
                if (e && e.type !== 'mouseleave' && !triggeredRef.current && clickRef.current) {
                    clickRef.current(e);
                }
            }, []);

            return {
                onMouseDown: start,
                onMouseUp: stop,
                onMouseLeave: stop,
                onTouchStart: start,
                onTouchEnd: stop,
            };
        };

        function App() {
            // State
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') !== 'light');

            const toggleTheme = () => {
                const newMode = !isDarkMode;
                setIsDarkMode(newMode);
                localStorage.setItem('theme', newMode ? 'dark' : 'light');
                if (newMode) {
                    document.documentElement.classList.remove('light-mode');
                    document.getElementById('antd-theme-link').href = 'https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.15/antd.dark.min.css';
                } else {
                    document.documentElement.classList.add('light-mode');
                    document.getElementById('antd-theme-link').href = 'https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.15/antd.min.css';
                }
            };

            const [location, setLocation] = useState(null);
            const [item, setItem] = useState(null);
            const [liveWeight, setLiveWeight] = useState(0);
            const [lockedWeight, setLockedWeight] = useState(null);
            const [isLocked, setIsLocked] = useState(false);

            const [scaleConnected, setScaleConnected] = useState(false);
            const [printerConnected, setPrinterConnected] = useState(false);

            const scaleDeviceRef = useRef(null);
            const scaleCharacteristicRef = useRef(null);
            const scaleKeepAliveRef = useRef(null);
            const scaleReconnectRef = useRef(null);
            const scaleManualDisconnectRef = useRef(false);
            const printerDeviceRef = useRef(null);
            const printerCharRef = useRef(null);
            const printerReconnectRef = useRef(null);
            const printerManualDisconnectRef = useRef(false);

            const [records, setRecords] = useState(() => JSON.parse(localStorage.getItem('records') || '[]'));
            const [printHistory, setPrintHistory] = useState(() => JSON.parse(localStorage.getItem('printHistory') || '[]'));
            const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('settings') || JSON.stringify(DEFAULT_SETTINGS)));

            const [drawerVisible, setDrawerVisible] = useState(false);
            const [settingsVisible, setSettingsVisible] = useState(false);
            const [manualMode, setManualMode] = useState(null);
            const [scannerVisible, setScannerVisible] = useState(false);
            const [scannerTarget, setScannerTarget] = useState(null);
            const [cameras, setCameras] = useState([]);
            const [selectedCamera, setSelectedCamera] = useState(null);
            const [manualForm] = Form.useForm();

            useEffect(() => {
                if (scannerVisible) {
                    Html5Qrcode.getCameras().then(devices => {
                        if (devices && devices.length) {
                            setCameras(devices);
                        }
                    }).catch(err => console.error("Error getting cameras", err));
                } else {
                    setCameras([]);
                    setSelectedCamera(null);
                }
            }, [scannerVisible]);
            const html5QrcodeScannerRef = useRef(null);

            const stateRef = useRef({ location, item, isLocked, settings });
            useEffect(() => {
                stateRef.current = { location, item, isLocked, settings };
            });

            const locLongPress = useLongPress(() => {
                if (location) {
                    navigator.clipboard.writeText(location).catch(err => console.error(err));
                    message.success('Location copied');
                }
            }, () => {
                manualForm.setFieldsValue({ location });
                setManualMode('location');
            }, 600);

            const itemLongPress = useLongPress(() => {
                if (item) {
                    navigator.clipboard.writeText(item).catch(err => console.error(err));
                    message.success('Item ID copied');
                }
            }, () => {
                manualForm.setFieldsValue({ item });
                setManualMode('item');
            }, 600);

            const weightLongPress = useLongPress(() => {
                const w = isLocked ? lockedWeight : liveWeight;
                if (w) {
                    navigator.clipboard.writeText(w.toString()).catch(err => console.error(err));
                    message.success('Weight copied');
                }
            }, () => {
                manualForm.setFieldsValue({ weight: isLocked ? lockedWeight : liveWeight });
                setManualMode('weight');
            }, 600);

            // Save to localStorage when state changes
            useEffect(() => { localStorage.setItem('records', JSON.stringify(records)); }, [records]);
            useEffect(() => { localStorage.setItem('printHistory', JSON.stringify(printHistory)); }, [printHistory]);
            useEffect(() => { localStorage.setItem('settings', JSON.stringify(settings)); }, [settings]);

            // --- Scanner Listener (Keyboard) ---
            useEffect(() => {
                let barcodeBuffer = '';
                let timeoutId = null;

                const handleKeyDown = (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                    if (e.key === 'Enter') {
                        if (barcodeBuffer) {
                            processScan(barcodeBuffer);
                            barcodeBuffer = '';
                        }
                    } else if (e.key.length === 1) {
                        barcodeBuffer += e.key;
                        clearTimeout(timeoutId);
                        timeoutId = setTimeout(() => { barcodeBuffer = ''; }, 100);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => { window.removeEventListener('keydown', handleKeyDown); clearTimeout(timeoutId); };
            }, [settings]);

            const processScan = (scannedValue) => {
                const current = stateRef.current;
                if (!current) return;
                const { location, item, isLocked, settings } = current;

                const locReg = new RegExp(settings.locationRegex);
                const itemReg = new RegExp(settings.itemRegex);
                const printReg = new RegExp(settings.printCommandRegex || '^CMD-PRINT$');
                const saveReg = new RegExp(settings.saveCommandRegex || '^CMD-SAVE$');

                if (printReg.test(scannedValue)) {
                    const btn = document.getElementById('print-action-btn');
                    if (btn && !btn.disabled) { btn.click(); } else { message.error('Cannot print: missing data or unlocked weight.'); }
                } else if (saveReg.test(scannedValue)) {
                    const btn = document.getElementById('save-action-btn');
                    if (btn && !btn.disabled) { btn.click(); } else { message.error('Cannot save: missing data or unlocked weight.'); }
                } else if (locReg.test(scannedValue)) {
                    setLocation(scannedValue);
                    message.success(`Location scanned: ${scannedValue}`);
                    if (!item) message.info('Please scan an Item next.');
                } else if (itemReg.test(scannedValue)) {
                    setItem(scannedValue);
                    message.success(`Item scanned: ${scannedValue}`);
                    if (!location) message.info('Please scan a Location next.');
                } else {
                    message.warning(`Unknown scan format: ${scannedValue}`);
                }
            };

            const onScanSuccess = (decodedText) => {
                setScannerVisible(false);
                setScannerTarget((target) => {
                    if (target) {
                        manualForm.setFieldsValue({ [target]: decodedText });
                        return null;
                    } else {
                        processScan(decodedText);
                        return null;
                    }
                });
            };

            const onScanFailure = (error) => {
                // Ignore failure (continually searching for QR codes)
            };

            useEffect(() => {
                let isMounted = true;
                let html5QrCode;
                let startTimeout;

                if (scannerVisible) {
                    startTimeout = setTimeout(() => {
                        if (!isMounted) return;
                        html5QrCode = new Html5Qrcode("qr-reader");
                        html5QrcodeScannerRef.current = html5QrCode;

                        const startPromise = html5QrCode.start(
                            selectedCamera ? selectedCamera : { facingMode: "environment" },
                            { fps: 10, aspectRatio: 1.0 },
                            onScanSuccess,
                            onScanFailure
                        );

                        startPromise.then(() => {
                            if (!isMounted) {
                                html5QrCode.stop().then(() => html5QrCode.clear()).catch(console.error);
                            }
                        }).catch(err => {
                            if (isMounted) {
                                message.error("Camera error: " + err);
                                setScannerVisible(false);
                            }
                        });
                    }, 300);
                }

                return () => {
                    isMounted = false;
                    clearTimeout(startTimeout);
                    if (html5QrcodeScannerRef.current) {
                        const qrCode = html5QrcodeScannerRef.current;
                        if (qrCode.isScanning) {
                            qrCode.stop().then(() => {
                                qrCode.clear();
                            }).catch(err => console.error(err));
                        } else {
                            qrCode.clear();
                        }
                        html5QrcodeScannerRef.current = null;
                    }
                };
            }, [scannerVisible, selectedCamera]);

            // --- Scale Integration ---
            const scheduleScaleReconnect = (device) => {
                if (scaleManualDisconnectRef.current || scaleReconnectRef.current || !device) return;
                const attempts = device.trackTagScaleReconnectAttempts || 0;
                if (attempts >= 5) return;
                device.trackTagScaleReconnectAttempts = attempts + 1;
                scaleReconnectRef.current = setTimeout(() => {
                    scaleReconnectRef.current = null;
                    connectScale(device, true);
                }, Math.min(30000, 2000 * (attempts + 1)));
            };

            const connectScale = async (knownDevice = null, silent = false) => {
                try {
                    const device = knownDevice || await navigator.bluetooth.requestDevice({
                        filters: [{ services: [SCALE_SERVICE] }]
                    });

                    scaleManualDisconnectRef.current = false;
                    localStorage.setItem('trackTagScaleDeviceId', device.id);

                    if (!device.trackTagScaleDisconnectHandler) {
                        device.trackTagScaleDisconnectHandler = () => {
                            clearInterval(scaleKeepAliveRef.current);
                            scaleKeepAliveRef.current = null;
                            scaleCharacteristicRef.current = null;
                            setScaleConnected(false);
                            if (scaleDeviceRef.current === device) scaleDeviceRef.current = null;
                            if (!scaleManualDisconnectRef.current) scheduleScaleReconnect(device);
                            if (!scaleManualDisconnectRef.current) message.warning('Scale disconnected; reconnecting...');
                        };
                        device.addEventListener('gattserverdisconnected', device.trackTagScaleDisconnectHandler);
                    }

                    if (device.gatt.connected) return;
                    const server = await device.gatt.connect();
                    const service = await server.getPrimaryService(SCALE_SERVICE);
                    const characteristic = await service.getCharacteristic(SCALE_CHAR);

                    await characteristic.startNotifications();
                    scaleCharacteristicRef.current = characteristic;
                    scaleKeepAliveRef.current = setInterval(async () => {
                        try {
                            await scaleCharacteristicRef.current?.readValue();
                        } catch (err) {
                            console.debug('Scale keep-alive unavailable', err);
                        }
                    }, 10000);
                    characteristic.addEventListener('characteristicvaluechanged', (e) => {
                        const value = e.target.value;
                        const flags = value.getUint8(0);
                        const unitIsLbs = (flags & 0x01) !== 0;
                        const unitIsJin = (flags & 0x10) !== 0;

                        let rawWeight = value.getUint16(1, true);
                        let w = rawWeight;

                        if (unitIsLbs) w = rawWeight / 100 / 2.20462;
                        else if (unitIsJin) w = rawWeight / 100 / 2;
                        else w = rawWeight / 200;

                        setLiveWeight(w);
                    });

                    scaleDeviceRef.current = device;
                    device.trackTagScaleReconnectAttempts = 0;
                    setScaleConnected(true);
                    if (!silent) message.success('Scale connected');
                } catch (err) {
                    console.error(err);
                    setScaleConnected(false);
                    if (knownDevice && !scaleManualDisconnectRef.current) scheduleScaleReconnect(knownDevice);
                    if (!silent) message.error('Scale connection failed');
                }
            };

            const disconnectScale = () => {
                scaleManualDisconnectRef.current = true;
                clearTimeout(scaleReconnectRef.current);
                scaleReconnectRef.current = null;
                clearInterval(scaleKeepAliveRef.current);
                scaleKeepAliveRef.current = null;
                scaleCharacteristicRef.current = null;
                if (scaleDeviceRef.current && scaleDeviceRef.current.gatt.connected) {
                    scaleDeviceRef.current.gatt.disconnect();
                }
                scaleDeviceRef.current = null;
                setScaleConnected(false);
            };

            // --- Printer Integration ---
            const schedulePrinterReconnect = (device) => {
                if (printerManualDisconnectRef.current || printerReconnectRef.current || !device) return;
                const attempts = device.trackTagPrinterReconnectAttempts || 0;
                if (attempts >= 5) return;
                device.trackTagPrinterReconnectAttempts = attempts + 1;
                printerReconnectRef.current = setTimeout(() => {
                    printerReconnectRef.current = null;
                    connectPrinter(device, true);
                }, Math.min(30000, 2000 * (attempts + 1)));
            };

            const connectPrinter = async (knownDevice = null, silent = false) => {
                try {
                    const device = knownDevice || await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: [PRINTER_SERVICE]
                    });

                    printerManualDisconnectRef.current = false;
                    localStorage.setItem('trackTagPrinterDeviceId', device.id);

                    if (!device.trackTagPrinterDisconnectHandler) {
                        device.trackTagPrinterDisconnectHandler = () => {
                            setPrinterConnected(false);
                            printerCharRef.current = null;
                            if (printerDeviceRef.current === device) printerDeviceRef.current = null;
                            if (!printerManualDisconnectRef.current) schedulePrinterReconnect(device);
                            if (!printerManualDisconnectRef.current) message.warning('Printer disconnected; reconnecting...');
                        };
                        device.addEventListener('gattserverdisconnected', device.trackTagPrinterDisconnectHandler);
                    }

                    if (device.gatt.connected) return;
                    const server = await device.gatt.connect();
                    const service = await server.getPrimaryService(PRINTER_SERVICE);
                    const char = await service.getCharacteristic(PRINTER_CHAR);

                    printerDeviceRef.current = device;
                    printerCharRef.current = char;
                    device.trackTagPrinterReconnectAttempts = 0;
                    setPrinterConnected(true);
                    if (!silent) message.success('Printer connected');
                } catch (err) {
                    console.error(err);
                    setPrinterConnected(false);
                    if (knownDevice && !printerManualDisconnectRef.current) schedulePrinterReconnect(knownDevice);
                    if (!silent) message.error('Printer connection failed');
                }
            };

            const disconnectPrinter = () => {
                printerManualDisconnectRef.current = true;
                clearTimeout(printerReconnectRef.current);
                printerReconnectRef.current = null;
                if (printerDeviceRef.current && printerDeviceRef.current.gatt.connected) {
                    printerDeviceRef.current.gatt.disconnect();
                }
                printerDeviceRef.current = null;
                printerCharRef.current = null;
                setPrinterConnected(false);
            };

            useEffect(() => {
                let cancelled = false;
                const reconnectRememberedDevices = async () => {
                    if (!navigator.bluetooth?.getDevices) return;
                    try {
                        const devices = await navigator.bluetooth.getDevices();
                        if (cancelled) return;
                        const scaleId = localStorage.getItem('trackTagScaleDeviceId');
                        const printerId = localStorage.getItem('trackTagPrinterDeviceId');
                        const scale = devices.find(device => device.id === scaleId);
                        const printer = devices.find(device => device.id === printerId);
                        if (scale) connectScale(scale, true);
                        if (printer) connectPrinter(printer, true);
                    } catch (err) {
                        console.debug('Bluetooth auto-connect unavailable', err);
                    }
                };
                reconnectRememberedDevices();
                return () => { cancelled = true; };
            }, []);

            const delay = ms => new Promise(res => setTimeout(res, ms));

            const renderCanvas = (loc, itm, wt) => {
                const canvas = document.getElementById('labelCanvas');
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                settings.template.forEach(t => {
                    let content = t.content
                        .replace('{location}', loc || '')
                        .replace('{item}', itm || '')
                        .replace('{weight}', wt || '');

                    if (t.type === 'text') {
                        ctx.fillStyle = 'black';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.save();
                        ctx.translate(t.x, t.y);
                        ctx.rotate((t.rot || 0) * Math.PI / 180);
                        ctx.font = `bold ${t.size || 24}px sans-serif`;
                        ctx.fillText(content, 0, 0);
                        ctx.restore();
                    } else if (t.type === 'barcode' && content) {
                        const bcCanvas = document.getElementById('barcodeCanvas');
                        try {
                            JsBarcode(bcCanvas, content, {
                                format: t.format || "CODE128",
                                displayValue: t.showText,
                                margin: 0,
                                height: t.height || 40,
                                width: t.width || 2
                            });
                            ctx.save();
                            ctx.translate(t.x, t.y);
                            ctx.rotate((t.rot || 0) * Math.PI / 180);
                            ctx.drawImage(bcCanvas, -bcCanvas.width / 2, -bcCanvas.height / 2);
                            ctx.restore();
                        } catch (e) { console.error('Barcode error', e); }
                    }
                });
                return { canvas, ctx };
            };

            const getRasterCommand = (canvas, ctx) => {
                const width = canvas.width;
                const height = canvas.height;
                const bytesPerRow = Math.ceil(width / 8);
                const imgData = ctx.getImageData(0, 0, width, height).data;
                const rasterData = new Uint8Array(bytesPerRow * height);

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * width + x) * 4;
                        const brightness = (imgData[idx] + imgData[idx + 1] + imgData[idx + 2]) / 3;
                        if (brightness < 128) {
                            const byteIdx = (y * bytesPerRow) + Math.floor(x / 8);
                            const bitOffset = 7 - (x % 8);
                            rasterData[byteIdx] |= (1 << bitOffset);
                        }
                    }
                }
                const command = new Uint8Array(8 + rasterData.length);
                command.set([0x1D, 0x76, 0x30, 0x00], 0);
                command[4] = bytesPerRow & 0xFF;
                command[5] = (bytesPerRow >> 8) & 0xFF;
                command[6] = height & 0xFF;
                command[7] = (height >> 8) & 0xFF;
                command.set(rasterData, 8);
                return command;
            };

            const handlePrint = async (entryToPrint = null) => {
                const isReprint = entryToPrint && entryToPrint.item;
                const printLoc = isReprint ? entryToPrint.location : location;
                const printItm = isReprint ? entryToPrint.item : item;
                const printWt = isReprint ? entryToPrint.weight : lockedWeight;

                if (!isReprint && (!printLoc || !printItm || !isLocked)) {
                    return message.error('Missing location, item, or locked weight.');
                }
                if (!printerConnected) {
                    await connectPrinter();
                    if (!printerDeviceRef.current) return;
                }

                try {
                    message.loading({ content: 'Printing...', key: 'print' });
                    const { canvas, ctx } = renderCanvas(printLoc, printItm, printWt.toFixed(settings.decimalPlaces ?? 3));
                    const rasterCmd = getRasterCommand(canvas, ctx);

                    const writeCmd = async (cmd, waitMs = 50) => {
                        await printerCharRef.current.writeValueWithoutResponse(cmd);
                        await delay(waitMs);
                    };

                    await writeCmd(new Uint8Array([0x10, 0xFF, 0x84, 0x00]), 50);
                    await writeCmd(new Uint8Array(12), 50);
                    await writeCmd(new Uint8Array([0x10, 0xFF, 0xFE, 0x01]), 50);

                    const CHUNK_SIZE = 100;
                    for (let i = 0; i < rasterCmd.length; i += CHUNK_SIZE) {
                        await writeCmd(rasterCmd.slice(i, i + CHUNK_SIZE), 20);
                    }

                    await delay(500);
                    await writeCmd(new Uint8Array([0x1D, 0x0C]), 300);
                    await writeCmd(new Uint8Array([0x10, 0xFF, 0xFE, 0x45]), 50);

                    if (!isReprint) {
                        const printEntry = {
                            id: Date.now(),
                            timestamp: new Date().toISOString(),
                            location: printLoc,
                            item: printItm,
                            weight: printWt
                        };
                        setPrintHistory(prev => [printEntry, ...prev]);
                    }
                    message.success({ content: 'Label printed!', key: 'print' });

                } catch (err) {
                    console.error(err);
                    message.error({ content: 'Print failed.', key: 'print' });
                }
            };

            const handleSave = () => {
                if (!location || !item || !isLocked) {
                    return message.error('Missing location, item, or locked weight.');
                }

                const existingItems = records.filter(r => r.item === item);
                if (existingItems.length > 0) {
                    Modal.confirm({
                        title: 'Item ID already exists',
                        content: `Do you want to update the existing entry for ${item} or save as new?`,
                        okText: 'Update Existing',
                        cancelText: 'Save as New',
                        onOk: () => {
                            // Find most recent and update it
                            const sorted = [...existingItems].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                            const mostRecent = sorted[0];

                            const newRecords = records.map(r => {
                                if (r.id === mostRecent.id) {
                                    return { ...r, location, weight: lockedWeight, timestamp: new Date().toISOString() };
                                }
                                return r;
                            });
                            setRecords(newRecords);
                            message.success('Record updated.');
                            resetFlow();
                        },
                        onCancel: () => {
                            createNewRecord();
                        }
                    });
                } else {
                    createNewRecord();
                }
            };

            const createNewRecord = () => {
                const newRecord = {
                    id: Date.now(),
                    timestamp: new Date().toISOString(),
                    location,
                    item,
                    weight: lockedWeight
                };
                setRecords(prev => [newRecord, ...prev]);
                message.success('Record saved.');
                resetFlow();
            };

            const deleteRecord = (id) => {
                setRecords(prev => prev.filter(r => r.id !== id));
            };

            const deletePrintRecord = (id) => {
                setPrintHistory(prev => prev.filter(r => r.id !== id));
            };

            const resetFlow = () => {
                setItem(null);
                // Keep location typically
                setIsLocked(false);
                setLockedWeight(null);
            };

            const toggleLock = () => {
                if (isLocked) {
                    setIsLocked(false);
                    setLockedWeight(null);
                } else {
                    setIsLocked(true);
                    setLockedWeight(liveWeight);
                }
            };

            const handleShare = async () => {
                if (records.length === 0) return message.warning('No records to share.');

                const csvHeader = 'Timestamp,Location,Item ID,Weight\n';
                const csvRows = records.map(r => `${r.timestamp},${r.location},${r.item},${r.weight}`).join('\n');
                const csvContent = csvHeader + csvRows;

                const blob = new Blob([csvContent], { type: 'text/csv' });
                const file = new File([blob], 'records.csv', { type: 'text/csv' });

                if (navigator.share && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Warehouse Records',
                            text: 'Here are the latest warehouse records.'
                        });
                    } catch (err) {
                        console.error('Share failed', err);
                    }
                } else {
                    // Fallback download
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'records.csv';
                    a.click();
                    URL.revokeObjectURL(url);
                }
            };

            const handleLoadSettings = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'application/json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            try {
                                const newSettings = JSON.parse(ev.target.result);
                                setSettings({ ...DEFAULT_SETTINGS, ...newSettings });
                                message.success('Settings loaded successfully');
                                setSettingsVisible(false);
                            } catch (err) {
                                message.error('Invalid settings file');
                            }
                        };
                        reader.readAsText(file);
                    }
                };
                input.click();
            };

            const handleDownloadSettings = () => {
                const blob = new Blob([JSON.stringify(settings, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'settings.json';
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleShareSettings = async () => {
                const blob = new Blob([JSON.stringify(settings, null, 2)], { type: 'application/json' });
                const file = new File([blob], 'settings.json', { type: 'application/json' });

                if (navigator.share && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'Settings Configuration',
                            text: 'Here is the settings configuration.'
                        });
                    } catch (err) {
                        console.error('Share failed', err);
                    }
                } else {
                    handleDownloadSettings();
                }
            };

            return (
                <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
                    <div className="header">
                        <img src="icons/icon-96x96.png" alt="Track&Tag" style={{ height: 36, width: 36, borderRadius: 8, display: 'block' }} />
                        <Space>
                            <Button type="text" icon={<PlusOutlined />} onClick={() => { manualForm.resetFields(); manualForm.setFieldsValue({ location, item, weight: isLocked ? lockedWeight : liveWeight }); setManualMode('all'); }} />
                            <Button type="text" icon={<HistoryOutlined />} onClick={() => setDrawerVisible(true)} />
                            <Button type="text" icon={<BulbOutlined />} onClick={toggleTheme} />
                            <Button type="text" icon={<SettingOutlined />} onClick={() => setSettingsVisible(true)} />
                        </Space>
                    </div>

                    <div className="main-content">
                        <Row gutter={[16, 16]}>
                            <Col xs={24} sm={12}>
                                <Card
                                    title={<span><ScanOutlined style={{ marginRight: 8 }} />Scanns</span>}
                                    bordered={false}
                                    style={{ background: 'var(--panel-bg)', height: '100%' }}
                                    extra={<Button type="text" icon={<CameraOutlined />} onClick={() => { setScannerTarget(null); setScannerVisible(true); }} />}
                                >
                                    <div style={{ marginBottom: 16 }}>
                                        <Text type="secondary">Location</Text>
                                        <Title level={3} style={{ margin: 0, cursor: 'pointer', userSelect: 'none' }} {...locLongPress}>{location || '--'}</Title>
                                    </div>
                                    <div>
                                        <Text type="secondary">Item ID</Text>
                                        <Title level={3} style={{ margin: 0, cursor: 'pointer', userSelect: 'none' }} {...itemLongPress}>{item || '--'}</Title>
                                    </div>
                                </Card>
                            </Col>
                            <Col xs={24} sm={12}>
                                <Card
                                    title={<span><DashboardOutlined style={{ marginRight: 8 }} />Weigt</span>}
                                    extra={
                                        <span
                                            className={`status-badge ${scaleConnected ? 'status-connected' : 'status-disconnected'}`}
                                            onClick={scaleConnected ? disconnectScale : connectScale}
                                            style={{ cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '8px' }}
                                        >
                                            {scaleConnected ? <span className="status-dot"></span> : <DisconnectOutlined />}
                                            {scaleConnected ? 'Scale Connected' : 'Scale Disconnected'}
                                        </span>
                                    }
                                    bordered={false}
                                    style={{ background: 'var(--panel-bg)', height: '100%', display: 'flex', flexDirection: 'column' }}
                                    bodyStyle={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', flex: 1 }}
                                >
                                    <div className={`weight-display ${isLocked ? '' : 'unlocked'}`} style={{ cursor: 'pointer', userSelect: 'none' }} {...weightLongPress}>
                                        {(isLocked ? lockedWeight : liveWeight).toFixed(settings.decimalPlaces ?? 3)}
                                        <span className="weight-unit">kg</span>
                                    </div>
                                    <Button
                                        type={isLocked ? 'default' : 'primary'}
                                        block
                                        size="large"
                                        onClick={toggleLock}
                                        style={{ marginTop: 16 }}
                                    >
                                        {isLocked ? 'Unlock Weight' : 'Lock Weight'}
                                    </Button>
                                </Card>
                            </Col>
                        </Row>

                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 24, minHeight: 0 }}>
                            <Card
                                title={<span onClick={() => setDrawerVisible(true)} style={{ color: 'rgba(255,255,255,0.45)', cursor: 'pointer' }}>History ({records.length})</span>}
                                extra={<Button type="text" icon={<ShareAltOutlined />} onClick={handleShare} />}
                                size="small"
                                bordered={false}
                                style={{
                                    background: 'rgba(0, 0, 0, 0.2)',
                                    border: '1px dashed rgba(255,255,255,0.1)',
                                    flex: 1,
                                    display: 'flex',
                                    flexDirection: 'column',
                                    overflow: 'hidden'
                                }}
                                bodyStyle={{ flex: 1, overflowY: 'auto', minHeight: 0 }}
                            >
                                {records.length === 0 ? (
                                    <div style={{ textAlign: 'center', color: 'rgba(255,255,255,0.2)', padding: '24px 0' }}>No history entries</div>
                                ) : (
                                    <List
                                        itemLayout="horizontal"
                                        dataSource={records}
                                        renderItem={r => (
                                            <List.Item
                                                style={{ padding: '8px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}
                                                actions={[<Button type="text" style={{ color: '#3b82f6' }} icon={<PrinterOutlined />} onClick={() => handlePrint(r)} />]}
                                            >
                                                <List.Item.Meta
                                                    title={<span style={{ color: 'rgba(255,255,255,0.65)' }}>{r.item}</span>}
                                                    description={<span style={{ color: 'rgba(255,255,255,0.45)' }}>{new Date(r.timestamp).toLocaleString()}</span>}
                                                />
                                                <div style={{ textAlign: 'right', color: 'rgba(255,255,255,0.65)' }}>
                                                    <div>{r.weight.toFixed(settings.decimalPlaces ?? 3)} kg</div>
                                                    <div style={{ fontSize: '0.8em', color: 'rgba(255,255,255,0.45)' }}>{r.location}</div>
                                                </div>
                                            </List.Item>
                                        )}
                                    />
                                )}
                            </Card>
                        </div>
                    </div>

                    <div className="footer">
                        <Button
                            id="print-action-btn"
                            className="hide-text-mobile"
                            type="primary"
                            icon={<PrinterOutlined />}
                            size="large"
                            style={(!isLocked || !location || !item) ? { flex: 1 } : { flex: 1, backgroundColor: '#3b82f6', borderColor: '#3b82f6', color: '#ffffff', fontWeight: 'bold' }}
                            disabled={!isLocked || !location || !item}
                            onClick={handlePrint}
                        >
                            Print Label
                        </Button>
                        <Button
                            id="save-action-btn"
                            className="hide-text-mobile"
                            type="primary"
                            icon={<SaveOutlined />}
                            size="large"
                            style={(!isLocked || !location || !item) ? { flex: 1 } : { flex: 1, backgroundColor: '#10b981', borderColor: '#10b981', color: '#0b0f19', fontWeight: 'bold' }}
                            disabled={!isLocked || !location || !item}
                            onClick={handleSave}
                        >
                            Save Record
                        </Button>
                    </div>

                    {/* History Drawer */}
                    <Drawer
                        title={`History (${records.length})`}
                        placement="right"
                        onClose={() => setDrawerVisible(false)}
                        visible={drawerVisible}
                        width="min(400px, 100vw)"
                        bodyStyle={{ padding: 0 }}
                        destroyOnClose
                        extra={<Button icon={<ShareAltOutlined />} onClick={handleShare}>Share Records</Button>}
                    >
                        <Tabs defaultActiveKey="1" centered>
                            <Tabs.TabPane tab="Records" key="1">
                                <List
                                    itemLayout="horizontal"
                                    dataSource={records}
                                    renderItem={r => (
                                        <List.Item
                                            style={{ padding: '12px 24px' }}
                                            actions={[
                                                <Popconfirm title="Delete?" onConfirm={() => deleteRecord(r.id)} placement="left">
                                                    <Button type="text" style={{ color: '#ef4444' }} icon={<DeleteOutlined />} />
                                                </Popconfirm>,
                                                <Button type="text" style={{ color: '#3b82f6' }} icon={<PrinterOutlined />} onClick={() => handlePrint(r)} />
                                            ]}
                                        >
                                            <List.Item.Meta
                                                title={r.item}
                                                description={new Date(r.timestamp).toLocaleString()}
                                            />
                                            <div style={{ textAlign: 'right' }}>
                                                <div>{r.weight.toFixed(settings.decimalPlaces ?? 3)} kg</div>
                                                <div style={{ fontSize: '0.8em', color: 'gray' }}>{r.location}</div>
                                            </div>
                                        </List.Item>
                                    )}
                                />
                            </Tabs.TabPane>
                            <Tabs.TabPane tab="Print History" key="2">
                                <List
                                    itemLayout="horizontal"
                                    dataSource={printHistory}
                                    renderItem={r => (
                                        <List.Item
                                            style={{ padding: '12px 24px' }}
                                            actions={[
                                                <Popconfirm title="Delete?" onConfirm={() => deletePrintRecord(r.id)} placement="left">
                                                    <Button type="text" style={{ color: '#ef4444' }} icon={<DeleteOutlined />} />
                                                </Popconfirm>,
                                                <Button type="text" style={{ color: '#3b82f6' }} icon={<PrinterOutlined />} onClick={() => handlePrint(r)} />
                                            ]}
                                        >
                                            <List.Item.Meta
                                                title={r.item}
                                                description={new Date(r.timestamp).toLocaleString()}
                                            />
                                            <div style={{ textAlign: 'right' }}>
                                                <div>{r.weight.toFixed(settings.decimalPlaces ?? 3)} kg</div>
                                                <div style={{ fontSize: '0.8em', color: 'gray' }}>{r.location}</div>
                                            </div>
                                        </List.Item>
                                    )}
                                />
                            </Tabs.TabPane>
                        </Tabs>
                    </Drawer>

                    {/* Settings Drawer */}
                    <Drawer
                        title="Settings"
                        placement="right"
                        onClose={() => setSettingsVisible(false)}
                        visible={settingsVisible}
                        width="min(400px, 100vw)"
                        destroyOnClose
                        extra={
                            <Space>
                                <Button className="hide-text-mobile" icon={<UploadOutlined />} onClick={handleLoadSettings}>Load</Button>
                                <Button className="hide-text-mobile" icon={<DownloadOutlined />} onClick={handleDownloadSettings}>Download</Button>
                                <Button className="hide-text-mobile" icon={<ShareAltOutlined />} onClick={handleShareSettings}>Share</Button>
                            </Space>
                        }
                    >
                        <Button
                            type="dashed"
                            block
                            icon={<PrinterOutlined />}
                            onClick={connectPrinter}
                            style={{ marginBottom: 24 }}
                        >
                            {printerConnected ? 'Printer Connected (Reconnect)' : 'Pair Printer'}
                        </Button>
                        <Form
                            layout="vertical"
                            initialValues={settings}
                            onFinish={(vals) => {
                                setSettings({ ...settings, ...vals });
                                message.success('Settings saved');
                                setSettingsVisible(false);
                            }}
                        >
                            <Form.Item label="Decimal Places" name="decimalPlaces" rules={[{ required: true, type: 'number', min: 0, max: 10 }]}>
                                <InputNumber style={{ width: '100%' }} />
                            </Form.Item>
                            <Form.Item label="Location Regex" name="locationRegex" rules={[{ required: true }]}>
                                <Input />
                            </Form.Item>
                            <Form.Item label="Item Regex" name="itemRegex" rules={[{ required: true }]}>
                                <Input />
                            </Form.Item>
                            <Form.Item label="Print Command Regex" name="printCommandRegex">
                                <Input placeholder="e.g. ^CMD-PRINT$" />
                            </Form.Item>
                            <Form.Item label="Save Command Regex" name="saveCommandRegex">
                                <Input placeholder="e.g. ^CMD-SAVE$" />
                            </Form.Item>
                            <Form.Item label="JSON Template">
                                <Input.TextArea
                                    rows={8}
                                    defaultValue={JSON.stringify(settings.template, null, 2)}
                                    onChange={(e) => {
                                        try {
                                            const p = JSON.parse(e.target.value);
                                            setSettings(prev => ({ ...prev, template: p }));
                                        } catch (err) { }
                                    }}
                                />
                            </Form.Item>
                            <Form.Item>
                                <Button type="primary" htmlType="submit" block>Save Settings</Button>
                            </Form.Item>
                        </Form>
                    </Drawer>

                    {/* Manual Entry Modal */}
                    <Modal
                        title={manualMode === 'all' ? "Manual Entry" : `Edit ${manualMode === 'location' ? 'Location' : manualMode === 'item' ? 'Item ID' : 'Weight'}`}
                        visible={!!manualMode}
                        onCancel={() => setManualMode(null)}
                        onOk={() => manualForm.submit()}
                        destroyOnClose
                        focusTriggerAfterClose={false}
                        wrapClassName={isDarkMode ? 'dark-modal' : ''}
                    >
                        <Form
                            form={manualForm}
                            layout="vertical"
                            onFinish={(vals) => {
                                if (vals.location !== undefined) setLocation(vals.location);
                                if (vals.item !== undefined) setItem(vals.item);
                                if (vals.weight !== undefined && vals.weight !== null && vals.weight !== "") {
                                    const w = parseFloat(vals.weight);
                                    setLiveWeight(w);
                                    setLockedWeight(w);
                                    setIsLocked(true);
                                }
                                message.success('Manual entry applied');
                                setManualMode(null);
                                manualForm.resetFields();
                            }}
                        >
                            {(manualMode === 'all' || manualMode === 'location') && (
                                <Form.Item label="Location" name="location">
                                    <Input placeholder="e.g. LOC-A1" addonAfter={<CameraOutlined onClick={() => { setScannerTarget('location'); setScannerVisible(true); }} style={{ cursor: 'pointer' }} />} />
                                </Form.Item>
                            )}
                            {(manualMode === 'all' || manualMode === 'item') && (
                                <Form.Item label="Item ID" name="item">
                                    <Input placeholder="e.g. ITEM-1234" addonAfter={<CameraOutlined onClick={() => { setScannerTarget('item'); setScannerVisible(true); }} style={{ cursor: 'pointer' }} />} />
                                </Form.Item>
                            )}
                            {(manualMode === 'all' || manualMode === 'weight') && (
                                <Form.Item label="Weight (kg)" name="weight">
                                    <Input type="number" step="0.01" placeholder="e.g. 5.25" />
                                </Form.Item>
                            )}
                        </Form>
                    </Modal>

                    {/* Camera Scanner Modal */}
                    <Modal
                        title={<span style={{ display: 'flex', alignItems: 'center', gap: '8px' }}><CameraOutlined /> Scan QR Code</span>}
                        visible={scannerVisible}
                        onCancel={() => { setScannerVisible(false); setScannerTarget(null); }}
                        footer={
                            cameras.length > 0 ? (
                                <Select
                                    style={{ width: '100%' }}
                                    value={selectedCamera || undefined}
                                    placeholder="Select Camera"
                                    onChange={(val) => setSelectedCamera(val)}
                                >
                                    {cameras.map(c => (
                                        <Select.Option key={c.id} value={c.id}>{c.label || `Camera ${c.id}`}</Select.Option>
                                    ))}
                                </Select>
                            ) : null
                        }
                        focusTriggerAfterClose={false}
                        wrapClassName={isDarkMode ? 'dark-modal' : ''}
                        zIndex={1050}
                    >
                        <div style={{ position: 'relative', overflow: 'hidden', borderRadius: '8px', marginTop: '16px' }}>
                            <div id="qr-reader" style={{ width: '100%' }}></div>
                            <div className="reticle">
                                <span className="corner tl"></span><span className="corner tr"></span>
                                <span className="corner bl"></span><span className="corner br"></span>
                                <div className="scanline"></div>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('[SW] Registered, scope:', reg.scope))
                    .catch(err => console.error('[SW] Registration failed:', err));
            });
        }
    </script>
</body>

</html>
